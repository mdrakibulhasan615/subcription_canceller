name: DB
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
permissions:
  contents: read
concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.3.0
      - run: supabase db start
      - run: supabase test db
